apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: load-tester
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - orchestrator.yaml
  - worker.yaml
  - target.yaml
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus.yml
  - name: grafana-datasources
    files:
      - prometheus.yml=grafana/provisioning/datasources/prometheus.yml
  - name: grafana-dashboard-provisioning
    files:
      - dashboards.yml=grafana/provisioning/dashboards/dashboards.yml
  - name: grafana-dashboards
    files:
      - load-tester-overview.json=grafana/dashboards/load-tester-overview.json
generatorOptions:
  disableNameSuffixHash: true
