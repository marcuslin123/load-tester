apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: load-tester-orchestrator
    newTag: kind
  - name: load-tester-worker
    newTag: kind
  - name: load-tester-target
    newTag: kind
patches:
  - target:
      group: batch
      version: v1
      kind: Job
      name: load-tester-orchestrator
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
