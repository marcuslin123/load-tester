apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: load-tester-orchestrator
    newName: example.invalid/load-tester-orchestrator
    newTag: sha-required
  - name: load-tester-worker
    newName: example.invalid/load-tester-worker
    newTag: sha-required
  - name: load-tester-target
    newName: example.invalid/load-tester-target
    newTag: sha-required
patches:
  - path: workloads-patch.yaml
