apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../eks
  - ../../target-hpa
  - ../../addons/metrics-server
  - ../../addons/kube-state-metrics
configMapGenerator:
  - name: prometheus-config
    behavior: replace
    files:
      - prometheus.yml=prometheus.yml
  - name: grafana-dashboards
    behavior: merge
    files:
      - target-autoscaling.json=grafana/dashboards/target-autoscaling.json
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: platform-patch.yaml
  - target:
      group: batch
      version: v1
      kind: Job
      name: load-tester-orchestrator
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
