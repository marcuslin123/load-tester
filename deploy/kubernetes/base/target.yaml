apiVersion: v1
kind: Service
metadata:
  name: autoscale-target
spec:
  selector:
    app.kubernetes.io/name: autoscale-target
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscale-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autoscale-target
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoscale-target
    spec:
      automountServiceAccountToken: false
      containers:
        - name: target
          image: load-tester-target:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
