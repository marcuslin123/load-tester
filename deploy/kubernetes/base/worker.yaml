apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-tester-worker
  labels:
    io.github.marcuslin123.load-tester.managed: "true"
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: load-tester-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-tester-worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: load-tester-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ORCHESTRATOR_ADDR
              value: load-tester-orchestrator:9090
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            limits:
              cpu: 250m
