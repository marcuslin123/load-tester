apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: load-tester-orchestrator
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["load-tester-worker"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["load-tester-worker"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: load-tester-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: load-tester-orchestrator
subjects:
  - kind: ServiceAccount
    name: load-tester-orchestrator
    namespace: load-tester
