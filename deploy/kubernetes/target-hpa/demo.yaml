name: kubernetes-target-hpa

target:
  protocol: http
  method: GET
  url: http://autoscale-target:8080/burn?ms=20
  headers:
    Connection: close

load:
  model: constant-rate
  rate: 30
  max_in_flight: 500
  duration: 2m
  ramp_up: 10s

fleet:
  min_workers: 2
  max_workers: 2
  autoscale: false

thresholds:
  p99_latency: 0
  error_rate: 1
